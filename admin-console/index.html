<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>JobLink LK · Admin</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- shown when config.js is not filled in -->
  <div id="setup" class="center" hidden>
    <div class="card narrow">
      <h1>Almost there</h1>
      <p>Open <code>config.js</code> and paste your Supabase <b>Project URL</b> and <b>anon public key</b>, then reload this page.</p>
    </div>
  </div>

  <!-- login -->
  <div id="login" class="center" hidden>
    <form id="login-form" class="card narrow" autocomplete="on">
      <img src="logo.png" alt="JobLink LK" class="login-logo" />
      <h1>JobLink LK Admin</h1>
      <p class="muted">Sign in with your admin e-mail and password.</p>
      <label>E-mail<input id="login-email" type="email" autocomplete="username" required /></label>
      <label>Password<input id="login-password" type="password" autocomplete="current-password" required /></label>
      <div id="login-error" class="error" role="alert"></div>
      <button class="btn primary block" type="submit" id="login-btn">Sign in</button>
    </form>
  </div>

  <!-- console -->
  <div id="app" hidden>
    <aside class="sidebar">
      <div class="brand"><img src="logo.png" alt="" /><div><b>JobLink LK</b><span>Admin console</span></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="me" class="me"></div>
        <button class="btn ghost block" id="signout">Sign out</button>
      </div>
    </aside>
    <main>
      <header class="pagehead"><div><h2 id="title"></h2><p id="subtitle" class="muted"></p></div><div id="head-actions"></div></header>
      <section id="view"></section>
    </main>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="overlay" hidden></div>

  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
